# Full stack locally:
#   docker compose up --build              # UI http://localhost:3000, API http://localhost:3001
#   (after code changes, rebuild the WHOLE stack: `docker compose up -d --build`. Rebuilding a single
#    service can leave the worker removed on older Compose versions, and uploads then stay "verifying")
#   docker compose up --build --scale worker=3
#   docker compose down -v                 # stop and wipe all data
#
# Infrastructure only (to run client/server with npm on your machine):
#   docker compose up -d postgres redis s3
#
# Face detection defaults to the dev stub. For real AWS Rekognition, put these in a
# root-level .env file (gitignored) or export them in your shell:
#   FACE_DETECTOR=rekognition
#   AWS_ACCESS_KEY_ID=...
#   AWS_SECRET_ACCESS_KEY=...
#   REKOGNITION_REGION=us-east-1

x-server-env: &server-env
  DATABASE_URL: postgresql://app:app@postgres:5432/images?schema=public
  REDIS_URL: redis://redis:6379
  # Storage defaults to the local S3 container. For REAL AWS S3, set in the root .env:
  #   S3_BUCKET=<your-bucket>  S3_REGION=<bucket-region>
  #   S3_ENDPOINT=  S3_PUBLIC_ENDPOINT=  S3_ACCESS_KEY_ID=  S3_SECRET_ACCESS_KEY=   (empty = AWS keys below)
  S3_BUCKET: ${S3_BUCKET-images}
  S3_REGION: ${S3_REGION-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT-http://s3:9090} # container-to-container
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT-http://localhost:9090} # what the browser can reach (presigned URLs)
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID-local}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY-local}
  CORS_ORIGINS: http://localhost:3000
  NODE_ENV: development # "production" refuses FACE_DETECTOR=stub
  FACE_DETECTOR: ${FACE_DETECTOR:-stub}
  REKOGNITION_REGION: ${REKOGNITION_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: images
    ports:
      - "5433:5432" # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d images"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"] # persist queued jobs across restarts
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible API for local dev (the app talks to it with the normal AWS SDK).
  # In production, drop S3_ENDPOINT and point at a real, private S3 bucket.
  s3:
    image: adobe/s3mock:3.12.0
    environment:
      initialBuckets: images
      retainFilesOnExit: "true"
      root: /data
    ports:
      - "9090:9090"
    volumes:
      - s3_data:/data

  # One-shot: applies DB migrations, then exits. api/worker wait for it to succeed.
  migrate:
    build:
      context: ./server
      target: build # has the Prisma CLI (dev dependency)
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/images?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./server
    environment:
      <<: *server-env
      PROCESS_ROLE: api
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./server
    environment:
      <<: *server-env
      PROCESS_ROLE: worker
      WORKER_CONCURRENCY: 4
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_started
    stop_grace_period: 30s # let in-flight jobs finish on shutdown

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  s3_data:
