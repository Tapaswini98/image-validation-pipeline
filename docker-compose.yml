# Full stack locally (needs AWS credentials, see the root .env below):
#   docker compose up --build              # UI http://localhost:3000, API http://localhost:3001
#   (after code changes, rebuild the WHOLE stack: `docker compose up -d --build`. Rebuilding a single
#    service can leave the worker removed on older Compose versions, and uploads then stay "verifying")
#   docker compose up --build --scale worker=3
#   docker compose down -v                 # stop and wipe Postgres + Redis data (S3 objects stay)
#
# Infrastructure only (to run client/server with npm on your machine):
#   docker compose up -d postgres redis
#
# Storage is a real private AWS S3 bucket and faces go to AWS Rekognition. Put these in a
# root-level .env file (gitignored) or export them in your shell:
#   S3_BUCKET=<your-bucket>
#   S3_REGION=<bucket-region>
#   REKOGNITION_REGION=<region>            # defaults to S3_REGION
#   AWS_ACCESS_KEY_ID=...
#   AWS_SECRET_ACCESS_KEY=...

x-server-env: &server-env
  DATABASE_URL: postgresql://app:app@postgres:5432/images?schema=public
  REDIS_URL: redis://redis:6379
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in the root .env}
  S3_REGION: ${S3_REGION:?set S3_REGION in the root .env}
  REKOGNITION_REGION: ${REKOGNITION_REGION:-${S3_REGION}}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in the root .env}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in the root .env}
  CORS_ORIGINS: http://localhost:3000
  NODE_ENV: development
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: images
    ports:
      - "5433:5432" # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d images"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"] # persist queued jobs across restarts
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  # One-shot: applies DB migrations, then exits. api/worker wait for it to succeed.
  migrate:
    build:
      context: ./server
      target: build # has the Prisma CLI (dev dependency)
    pull_policy: build # always rebuild on `up`: a stale image can carry migrations the DB doesn't know
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/images?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./server
    pull_policy: build
    environment:
      <<: *server-env
      PROCESS_ROLE: api
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./server
    pull_policy: build
    environment:
      <<: *server-env
      PROCESS_ROLE: worker
      WORKER_CONCURRENCY: 4
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 30s # let in-flight jobs finish on shutdown

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    pull_policy: build
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
